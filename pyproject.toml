[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netscanner"
version = "0.1.0"
description = "Parse authorized Nmap results, inventory exposed services and produce security findings."
requires-python = ">=3.10"
dependencies = ["defusedxml>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
netscanner = "netscanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
